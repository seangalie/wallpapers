---
name: 🐛 Bug Report
description: Report an image, filename, category, or documentation problem in Sean's Wallpaper Archive
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The more precisely you can
        describe the problem, the faster it can be reproduced and fixed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues and this has not been reported yet.
          required: true
        - label: I checked the current archive and the problem is still present.
          required: true

  - type: input
    id: version
    attributes:
      label: Revision or download date
      description: The commit, release tag, or approximate date of the copy you downloaded.
      placeholder: "main, 0a1b2c3, or 2026-10-02"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Image path and problem
      description: Include the full repository path and describe the image, name, category, or documentation problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence someone else can follow to see the same result.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: For display issues, include your operating system, screen resolution, and monitor layout.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant errors
      description: This is rendered as a code block automatically, so no backticks are needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Source URLs, creator credits, suggested paths, or related issues.
    validations:
      required: false
