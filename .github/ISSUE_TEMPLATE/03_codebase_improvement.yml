---
name: 🛠 Codebase Improvement
description: Suggest organization, tooling, or maintenance improvements for Sean's Wallpaper Archive
title: "dev: "
labels: ["enhancement", "refactor"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for archive organization, tooling, or maintenance improvements.
        Include an old-to-new path list when proposing bulk file changes.

  - type: textarea
    id: area
    attributes:
      label: What part of the archive?
      description: The folders, files, documentation, or workflows this concerns.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What is the current approach?
      description: Describe how it works today and what makes it worth changing.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you change it to?
      description: The improvement you have in mind, and the benefit it brings.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and risks
      description: What would this cost, break, or make harder?
    validations:
      required: false
