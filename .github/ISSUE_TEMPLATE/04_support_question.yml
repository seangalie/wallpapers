---
name: ❓ Support Question
description: Ask how to browse or use Sean's Wallpaper Archive
title: "support: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended conversation is usually a better fit for Discussions. Use this
        form when you have a specific question about using Sean's Wallpaper Archive.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I read the README and the documentation.
          required: true
        - label: I searched the existing issues and discussions.
          required: true

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe your goal, not only the step you are stuck on.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Images, display settings, or download steps you have already tried.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Revision or download date
      description: The commit, release tag, or approximate date of the copy you downloaded.
      placeholder: "main, 0a1b2c3, or 2026-10-02"
    validations:
      required: false
