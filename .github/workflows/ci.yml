# Checks the wallpaper collection with scripts/check-collection.sh: layout,
# formats, categories, filenames, file modes, Git LFS tracking,
# case-insensitive path collisions, exact duplicates, and the README's
# collection table. A second job tests scripts/build-site.sh, which builds the
# gallery site, against tiny images it makes itself.
#
# The checkout deliberately leaves LFS images as pointer files. The check reads
# everything it needs from the Git index and the pointers, so CI never spends
# the repository's monthly Git LFS bandwidth.
#
# Make "🧪 Check the collection" a required status check in the default
# branch's protection rule or ruleset.
#
# Pin every third-party action to a full commit SHA with the version in a
# trailing comment, as the other workflows here do; Dependabot keeps them
# current.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running build. Builds of main
# are never cancelled, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 🧪 Check the collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: 🧪 Test the collection checker
        run: bash scripts/test-check-collection.sh

      - name: 🚀 Run the collection check
        run: bash scripts/check-collection.sh

  site:
    name: 🧪 Test the site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: 📦 Install ImageMagick
        run: |
          set -euo pipefail
          if ! command -v convert > /dev/null 2>&1 && ! command -v magick > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends imagemagick
          fi

      - name: 🧪 Test the site build
        # The tests make their own tiny images, so no LFS content is needed.
        run: bash scripts/test-build-site.sh
