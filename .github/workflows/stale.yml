---
name: Stale

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: 🧹 Clean up stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      # actions/stale keeps its progress in the Actions cache and needs this
      # to delete the previous run's entry.
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: 🚀 Run stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          # Bugs and anything with a priority are triaged work that stays open until
          # someone deals with it, however long that takes. The sweep is for
          # questions and ideas that lost momentum.
          exempt-issue-labels: >-
            no-stale,in-progress,help wanted,good first issue,security,bug,
            priority-critical,priority-high,priority-medium,priority-low
          stale-issue-message: >
            This issue has had no activity for 60 days, so it has been marked
            as stale.

            If it still matters to you, leave a comment, such as an updated
            image path, source link, or detail, and it will stay open.
            Otherwise it will be closed in 14 days. You can always open a new
            issue later.

            Thanks for helping with Sean's Wallpaper Archive!
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale,in-progress"
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it has been
            marked as stale.

            Push a change or leave a comment to keep it open. Otherwise it will
            be closed in 14 days.

            Thanks for contributing to Sean's Wallpaper Archive!
